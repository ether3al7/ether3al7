name: Profile stats

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays at 06:17 UTC (off-peak minute, less scheduler contention).
    - cron: "17 6 * * 1"

# The built-in GITHUB_TOKEN is only used to commit the generated SVGs.
# All GitHub data access uses the PROFILE_STATS_TOKEN secret instead.
permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile stat cards
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          python3 scripts/profile_stats.py \
            --stats-out profile/github-stats.svg \
            --langs-out profile/top-langs.svg

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- profile/github-stats.svg profile/top-langs.svg)" ]; then
            echo "Generated cards are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-stats.svg profile/top-langs.svg
          git commit -m "chore: update profile language stats"
          git push
